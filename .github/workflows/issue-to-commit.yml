name: Issue to Commit & Rebuild

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  apply-issue-update:
    # Security guard: only run when opened by the repository owner and labeled 'autocommit' (or prefixed with [commit])
    if: >
      github.event.issue.user.login == github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'autocommit') || startsWith(github.event.issue.title, '[commit]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply file blocks or unified diff from Issue body
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - << 'PY'
          import os, re, pathlib, subprocess

          body = os.environ.get('ISSUE_BODY') or ''
          # Support ```file:src/world.js ... ``` blocks in issue descriptions
          pattern = re.compile(r'```file:([^
]+)?
(.*?)```', re.S)
          matches = pattern.findall(body)
          for rel_path, content in matches:
              target = pathlib.Path(rel_path.strip())
              assert not target.is_absolute() and '..' not in target.parts, f'Invalid path: {target}'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
              print(f'Updated {target}')

          # Rebuild standalone index.html and contact.html if src/ changed
          if pathlib.Path('build.py').exists():
              subprocess.run(['python3', 'build.py'], check=True)
          if pathlib.Path('All_That_Jazz_3D_Website_V3.zip').exists():
              pathlib.Path('All_That_Jazz_3D_Website_V3.zip').unlink()
          PY

      - name: Run verification suite
        run: |
          node verify.mjs
          node verify-house.mjs

      - name: Commit and push changes
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed 's/^\[commit\]\s*//')
            git commit -m "$CLEAN_TITLE (closes #$ISSUE_NUMBER)"
            git push origin HEAD:main
          else
            echo "No file changes detected in issue body."
          fi
